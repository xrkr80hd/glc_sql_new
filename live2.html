<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Stream — Liberty Church</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
  <style>
    body.live-stream-page { margin: 0; padding: 0; overflow: hidden; background: #000; }
    .live-stream-container { position: fixed; inset: 0; display: flex; flex-direction: column; }
    .live-stream-header { background: #0f2417; color: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; z-index: 10; }
    .live-stream-header .brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; }
    .live-stream-header .brand img { height: 32px; }
    .live-stream-header .live-badge { background: #dc3545; color: #fff; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    .live-stream-header .close-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; text-decoration: none; }
    .live-stream-header .close-btn:hover { background: rgba(255,255,255,0.2); }
    .live-embed-wrapper { flex: 1; position: relative; background: #000; }
    .live-embed-wrapper iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .loading-spinner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.2rem; }
  </style>
</head>
<body class="live-stream-page">
  <div class="live-stream-container">
    <div class="live-stream-header">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="Liberty Church">
        <span>Liberty Church</span>
      </a>
      <div style="display: flex; align-items: center; gap: 16px;">
        <span class="live-badge">🔴 LIVE</span>
        <a href="live.html" class="close-btn">Exit Stream</a>
      </div>
    </div>
    <div class="live-embed-wrapper" id="streamEmbed">
      <div class="loading-spinner">Loading live stream...</div>
    </div>
  </div>

  <script>
  (function() {
    // Poll stream status and redirect if stream ends
    function checkStreamStatus() {
      fetch('/api/stream-status/')
        .then(res => res.json())
        .then(data => {
          if (!data.is_live) {
            // Stream ended, redirect back to live.html
            window.location.href = 'live.html';
          } else if (data.embed_code) {
            // Inject live embed if not already loaded
            const embedWrapper = document.getElementById('streamEmbed');
            if (embedWrapper && embedWrapper.querySelector('.loading-spinner')) {
              embedWrapper.innerHTML = data.embed_code;
            }
          }
        })
        .catch(err => console.error('Stream status check failed:', err));
    }

    // Initial load
    checkStreamStatus();
    
    // Poll every 30 seconds
    setInterval(checkStreamStatus, 30000);
  })();
  </script>
</body>
</html>
